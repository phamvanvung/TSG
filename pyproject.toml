[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsg-repro"
version = "1.0.0"
description = "Reproducibility core for Task-Sensitive Geometry under degraded-image object detection"
requires-python = ">=3.10"
authors = [{name = "Van Vung Pham"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
model = ["torch>=2.1", "ultralytics==8.4.131"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
